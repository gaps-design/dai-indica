<input id="titulo" placeholder="Título do produto">
<input id="preco" placeholder="Preço. Ex: R$ 1.299,00">
<input id="imagem" placeholder="Link da imagem">
<input id="link" placeholder="Link do produto / afiliado">

<select id="loja">
  <option value="mercado-livre">Mercado Livre</option>
  <option value="shopee">Shopee</option>
  <option value="magalu">Magalu</option>
  <option value="natura">Natura</option>
  <option value="boticario">O Boticário</option>
</select>

<select id="categoria">
  <option value="tecnologia">Tecnologia</option>
  <option value="casa">Casa</option>
  <option value="beleza">Beleza</option>
  <option value="moda">Moda</option>
  <option value="infantil">Infantil</option>
  <option value="mercado">Mercado</option>
</select>

<input id="desconto" placeholder="Ex: Oferta, -30%, Promoção">
<label>
  <input type="checkbox" id="destaque" checked>
  Aparecer na página inicial
</label>

<button onclick="gerarJSON()">Gerar JSON</button>

<textarea id="resultado" rows="14"></textarea>

<script>
function nomeLoja(slug) {
  const lojas = {
    "mercado-livre": "Mercado Livre",
    "shopee": "Shopee",
    "magalu": "Magalu",
    "natura": "Natura",
    "boticario": "O Boticário"
  };

  return lojas[slug] || slug;
}

function nomeCategoria(slug) {
  const categorias = {
    "tecnologia": "Tecnologia",
    "casa": "Casa",
    "beleza": "Beleza",
    "moda": "Moda",
    "infantil": "Infantil",
    "mercado": "Mercado"
  };

  return categorias[slug] || slug;
}

function gerarJSON() {
  const lojaSlug = document.getElementById("loja").value;
  const categoriaSlug = document.getElementById("categoria").value;

  const produto = {
    titulo: document.getElementById("titulo").value,
    preco: document.getElementById("preco").value,
    imagem: document.getElementById("imagem").value,
    link: document.getElementById("link").value,
    loja: nomeLoja(lojaSlug),
    lojaSlug: lojaSlug,
    categoria: nomeCategoria(categoriaSlug),
    categoriaSlug: categoriaSlug,
    desconto: document.getElementById("desconto").value || "Oferta",
    destaque: document.getElementById("destaque").checked
  };

  document.getElementById("resultado").value =
    JSON.stringify(produto, null, 2);
}
</script>
