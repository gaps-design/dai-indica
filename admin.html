<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Daí Indica</title>
  <style>
    body { font-family: Arial; background:#fff6f3; padding:40px; }
    .box { max-width:700px; margin:auto; background:white; padding:30px; border-radius:24px; box-shadow:0 10px 30px #0002; }
    h1 { color:#c94f63; }
    input, select, button { width:100%; padding:15px; margin-top:12px; border-radius:12px; border:1px solid #ddd; font-size:16px; }
    button { background:linear-gradient(135deg,#e64f69,#f5a623); color:white; font-weight:bold; border:0; cursor:pointer; }
    .msg { margin-top:20px; font-weight:bold; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Painel Daí Indica</h1>

    <input id="link" placeholder="Cole o link do produto">

    <select id="loja">
      <option value="mercado-livre">Mercado Livre</option>
      <option value="shopee">Shopee</option>
      <option value="magalu">Magalu</option>
      <option value="amazon">Amazon</option>
      <option value="natura">Natura</option>
      <option value="boticario">O Boticário</option>
    </select>

    <select id="categoria">
      <option value="tecnologia">Tecnologia</option>
      <option value="casa">Casa</option>
      <option value="beleza">Beleza</option>
      <option value="moda">Moda</option>
      <option value="infantil">Infantil</option>
      <option value="mercado">Mercado</option>
    </select>

    <label>
      <input type="checkbox" id="destaque" checked>
      Aparecer na página inicial
    </label>

    <button onclick="publicar()">Publicar produto</button>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    async function publicar() {
      const msg = document.getElementById("msg");
      msg.innerText = "Publicando...";

      const resposta = await fetch("/api/publicar-produto", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          link: document.getElementById("link").value,
          lojaSlug: document.getElementById("loja").value,
          categoriaSlug: document.getElementById("categoria").value,
          destaque: document.getElementById("destaque").checked
        })
      });

      const dados = await resposta.json();

      if (dados.erro) {
        msg.style.color = "red";
        msg.innerText = dados.mensagem;
      } else {
        msg.style.color = "green";
        msg.innerText = "Produto publicado com sucesso!";
      }
    }
  </script>
</body>
</html>
